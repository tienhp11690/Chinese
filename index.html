<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URGENT FIX TESTER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .container { max-width: 1800px; margin: 0 auto; }
        h1 { color: #f48771; margin-bottom: 20px; font-size: 2rem; }
        .urgent { color: #f48771; font-weight: bold; }
        .btn {
            padding: 14px 28px;
            background: #f48771;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 10px 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .btn:hover { background: #e06050; }
        .section {
            background: #2d2d2d;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border-left: 4px solid #f48771;
        }
        h2 { color: #f48771; margin-bottom: 20px; font-size: 1.5rem; }
        pre {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            line-height: 1.8;
            border: 2px solid #3e3e3e;
            font-size: 1.05rem;
        }
        .error { color: #f48771; font-weight: bold; }
        .success { color: #4ec9b0; font-weight: bold; }
        .warning { color: #dcdcaa; font-weight: bold; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #3e3e3e;
            padding: 14px;
            text-align: left;
            color: #f48771;
            font-size: 1.05rem;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #3e3e3e;
            font-size: 0.95rem;
        }
        .bad { background: #3a2020; }
        .good { background: #1a3a1a; }
        input {
            width: 100%;
            padding: 12px;
            background: #3e3e3e;
            border: 2px solid #555;
            color: #d4d4d4;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 24px;
        }
        .parser-result {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #3e3e3e;
        }
        .parser-result h3 {
            margin-bottom: 16px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="urgent">🚨 URGENT FIX TESTER 🚨</h1>
    <p style="color:#f48771;font-size:1.2rem;margin-bottom:24px;">Test NGAY để xem parser có work không!</p>
    
    <div class="section">
        <h2>📥 Step 1: Fetch Raw CSV</h2>
        <input type="text" id="sheetId" value="1b0rr7I0Z1gVc9o4pR8-0RpWC-pdtNwjasD_hEZ2Wuxw" placeholder="Sheet ID">
        <button class="btn" onclick="testParsers()">🧪 TEST ALL PARSERS NOW!</button>
    </div>

    <div id="results"></div>
</div>

<script>
// OLD PARSER (The one you copied - doesn't work!)
function parseCSVLine_OLD(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
            if (inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    
    result.push(current.trim());
    return result;
}

// NEW SMART PARSER (Should work!)
function parseCSVLine_SMART(line) {
    // First pass: standard CSV parsing
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
            if (inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    
    result.push(current.trim());
    
    // Smart merge if we have too many columns
    const expectedColumns = 7;
    
    if (result.length === expectedColumns) {
        return result;
    }
    
    if (result.length > expectedColumns) {
        const extraColumns = result.length - expectedColumns;
        const fixed = [];
        
        // Copy first 3 columns
        fixed.push(result[0]);
        fixed.push(result[1]);
        fixed.push(result[2]);
        
        // Merge Meaning field
        const meaningParts = [];
        for (let i = 3; i <= 3 + extraColumns; i++) {
            meaningParts.push(result[i]);
        }
        fixed.push(meaningParts.join(', '));
        
        // Copy remaining columns
        for (let i = 3 + extraColumns + 1; i < result.length; i++) {
            fixed.push(result[i]);
        }
        
        return fixed;
    }
    
    return result;
}

async function testParsers() {
    const sheetId = document.getElementById('sheetId').value.trim();
    const results = document.getElementById('results');
    
    results.innerHTML = '<div class="section"><p class="warning">⏳ Fetching CSV and testing...</p></div>';
    
    try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`);
        const csv = await res.text();
        
        console.clear();
        console.log('🔥 TESTING PARSERS\n' + '='.repeat(80));
        
        const lines = csv.split(/\r?\n/);
        const testRows = lines.slice(1, 21).filter(l => l.trim());
        
        let html = '<div class="section">';
        html += '<h2>📊 Comparison: OLD vs SMART Parser</h2>';
        html += '<p style="margin-bottom:20px;">Testing first 20 rows from your Google Sheets</p>';
        
        html += '<table><thead><tr>';
        html += '<th>#</th><th>Chinese</th><th>Raw CSV</th>';
        html += '<th>OLD Parser<br>Topic</th><th>SMART Parser<br>Topic</th><th>Status</th>';
        html += '</tr></thead><tbody>';
        
        let oldErrors = 0;
        let smartErrors = 0;
        
        testRows.forEach((line, idx) => {
            const oldResult = parseCSVLine_OLD(line);
            const smartResult = parseCSVLine_SMART(line);
            
            const chinese = oldResult[0] || smartResult[0];
            const oldTopic = oldResult[4] || '';
            const smartTopic = smartResult[4] || '';
            
            // Check if topics look like Vietnamese synonyms (indicators of error)
            const oldLooksWrong = oldTopic.length < 10 && !oldTopic.includes('Chào') && !oldTopic.includes('Số') && !oldTopic.includes('Ngày');
            const smartLooksWrong = smartTopic.length < 10 && !smartTopic.includes('Chào') && !smartTopic.includes('Số') && !smartTopic.includes('Ngày');
            
            if (oldResult.length !== 7) oldErrors++;
            if (smartResult.length !== 7) smartErrors++;
            
            const rowClass = (smartResult.length === 7 && !smartLooksWrong) ? 'good' : 'bad';
            
            html += `<tr class="${rowClass}">`;
            html += `<td>${idx + 1}</td>`;
            html += `<td><strong>${escapeHtml(chinese)}</strong></td>`;
            html += `<td><pre style="margin:0;background:transparent;padding:4px;font-size:0.85rem;">${escapeHtml(line.substring(0, 50))}...</pre></td>`;
            html += `<td class="${oldResult.length !== 7 || oldLooksWrong ? 'error' : ''}">${escapeHtml(oldTopic)} ${oldResult.length !== 7 ? '❌' : oldLooksWrong ? '⚠️' : ''}</td>`;
            html += `<td class="${smartResult.length !== 7 || smartLooksWrong ? 'error' : 'success'}">${escapeHtml(smartTopic)} ${smartResult.length === 7 && !smartLooksWrong ? '✅' : '❌'}</td>`;
            html += `<td>${smartResult.length === 7 && !smartLooksWrong ? '<span class="success">FIXED!</span>' : '<span class="error">ISSUE</span>'}</td>`;
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        html += '</div>';
        
        // Summary
        html += '<div class="section">';
        html += '<h2>📈 Summary</h2>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">';
        
        html += '<div>';
        html += '<h3 class="error">OLD Parser (Current)</h3>';
        html += `<p style="font-size:1.3rem;margin-top:12px;">❌ Errors: <strong>${oldErrors} / 20</strong></p>`;
        html += '<p style="margin-top:8px;">This is what you currently have on GitHub</p>';
        html += '</div>';
        
        html += '<div>';
        html += '<h3 class="success">SMART Parser (New)</h3>';
        html += `<p style="font-size:1.3rem;margin-top:12px;">✅ Errors: <strong>${smartErrors} / 20</strong></p>`;
        html += '<p style="margin-top:8px;">This is what you need to copy!</p>';
        html += '</div>';
        
        html += '</div></div>';
        
        // Code to copy
        html += '<div class="section">';
        html += '<h2>💻 CODE TO COPY TO GITHUB</h2>';
        html += '<p style="margin-bottom:16px;color:#f48771;">Replace your <code>parseCSVLine</code> function with THIS:</p>';
        html += '<pre style="border:3px solid #f48771;">';
        html += `function parseCSVLine(line) {
    // First pass: standard CSV parsing
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
            if (inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    
    result.push(current.trim());
    
    // SMART MERGE - This is the key difference!
    const expectedColumns = 7;
    
    if (result.length === expectedColumns) {
        return result; // Perfect!
    }
    
    if (result.length > expectedColumns) {
        // Too many columns - merge the Meaning field
        const extraColumns = result.length - expectedColumns;
        const fixed = [];
        
        // Copy first 3 columns (Chinese, Type, Pinyin)
        fixed.push(result[0]);
        fixed.push(result[1]);
        fixed.push(result[2]);
        
        // Merge Meaning field (index 3 + extra columns)
        const meaningParts = [];
        for (let i = 3; i <= 3 + extraColumns; i++) {
            meaningParts.push(result[i]);
        }
        fixed.push(meaningParts.join(', '));
        
        // Copy remaining columns (Topic, Difficulty, Learned)
        for (let i = 3 + extraColumns + 1; i < result.length; i++) {
            fixed.push(result[i]);
        }
        
        console.log(\`⚠️ Fixed column count from \${result.length} to \${fixed.length}\`);
        return fixed;
    }
    
    // Too few columns - cannot fix
    console.warn(\`❌ Got \${result.length} columns, expected \${expectedColumns}\`);
    return result;
}`;
        html += '</pre>';
        html += '<p style="margin-top:16px;color:#4ec9b0;">⚠️ Make sure to copy the ENTIRE function including the smart merge logic!</p>';
        html += '</div>';
        
        results.innerHTML = html;
        
    } catch (e) {
        results.innerHTML = `<div class="section"><p class="error">❌ Error: ${e.message}</p></div>`;
        console.error(e);
    }
}

function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
