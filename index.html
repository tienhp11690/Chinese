<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Chinese Pro">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">

    <title>Học Tiếng Trung Pro</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <!-- PWA Install Prompt -->
    <script>
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallButton();
      });

      function showInstallButton() {
        const installBtn = document.createElement('button');
        installBtn.textContent = 'Cài đặt App';
        installBtn.className = 'btn';
        installBtn.style.position = 'fixed';
        installBtn.style.bottom = '20px';
        installBtn.style.right = '20px';
        installBtn.style.zIndex = '1000';
        installBtn.onclick = () => {
          installBtn.style.display = 'none';
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(choice => {
            if (choice.outcome === 'accepted') {
              console.log('Đã cài đặt');
            }
            deferredPrompt = null;
          });
        };
        document.body.appendChild(installBtn);
      }
    </script>

    <!-- PINYIN PRO CDN -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.umd.js"></script>

    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW registered', reg))
            .catch(err => console.log('SW error', err));
        });
      }
    </script>

    <style>
        :root { --p: #667eea; --pd: #764ba2; --s: #48bb78; --d: #f56565; --g1: #f8f9fa; --g2: #e2e8f0; --g6: #4a5568; --g8: #2d3748; --r: 12px; --t: all .3s ease; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: system-ui; background: linear-gradient(135deg, var(--p), var(--pd)); min-height:100vh; color:var(--g8); }
        .c { max-width:1200px; margin:auto; padding:16px; }
        .h1 { text-align:center; color:white; font-size:2.5rem; margin-bottom:8px; text-shadow:0 2px 4px rgba(0,0,0,.3); }
        .nav { display:flex; background:white; border-radius:16px; padding:8px; margin-bottom:32px; box-shadow:0 10px 25px rgba(0,0,0,.15); gap:8px; flex-wrap:wrap; }
        .tab { flex:1; min-width:110px; padding:14px; text-align:center; border:none; border-radius:12px; font-weight:600; color:var(--g6); cursor:pointer; transition:var(--t); }
        .tab.active { background:linear-gradient(135deg,var(--p),var(--pd)); color:white; }
        .page { display:none; background:white; border-radius:16px; padding:32px; box-shadow:0 10px 25px rgba(0,0,0,.15); animation:f .4s; }
        .page.active { display:block; } @keyframes f { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none} }

        .grid, .fc-grid-3, .fc-grid-6 { display:grid; gap:20px; }
        .grid { grid-template-columns:repeat(3,1fr); }
        .fc-grid-3 { grid-template-columns:repeat(3,1fr); }
        .fc-grid-6 { grid-template-columns:repeat(3,1fr); }

        .stats { display:flex; gap:20px; font-size:.95rem; color:var(--g6); margin-bottom:24px; flex-wrap:wrap; }
        .stat { display:flex; align-items:center; gap:6px; background:var(--g1); padding:8px 14px; border-radius:20px; font-weight:500; }
        .n { font-weight:700; color:var(--p); }

        .filters { display:flex; flex-wrap:wrap; gap:10px; padding:16px; background:var(--g1); border-radius:12px; margin-bottom:24px; }
        .fbtn { padding:8px 16px; border:2px solid var(--g2); background:white; border-radius:20px; font-size:.9rem; cursor:pointer; display:flex; gap:6px; align-items:center; }
        .fbtn.active { background:var(--p); color:white; border-color:var(--p); }

        .card { background:white; border:1px solid var(--g2); border-radius:16px; padding:20px; position:relative; transition:var(--t); display:flex; flex-direction:column; justify-content:space-between; min-height:140px; }
        .card:hover { transform:translateY(-4px); box-shadow:0 10px 25px rgba(0,0,0,.15); }
        .card .play { background:rgba(102,126,234,.1); border:none; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--t); }
        .card .play:hover { background:var(--p); color:white; }

        .btn { padding:12px 24px; border:none; border-radius:12px; font-weight:600; cursor:pointer; display:inline-flex; gap:8px; align-items:center; transition:var(--t); background:linear-gradient(135deg,var(--p),var(--pd)); color:white; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(102,126,234,.3); }

        .layout-btn { padding:10px 20px; border:2px solid var(--g2); background:white; color:var(--g6); border-radius:12px; font-weight:600; cursor:pointer; transition:var(--t); }
        .layout-btn.active { background:var(--p); color:white; border-color:var(--p); transform:scale(1.05); }

        .fc { background:linear-gradient(135deg,var(--p),var(--pd)); color:white; border-radius:20px; padding:32px; cursor:pointer; min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 8px 25px rgba(0,0,0,.15); transition:var(--t); }
        .fc.showing-answer { background:linear-gradient(135deg,var(--s),#38a169); }
        .fc-chinese { font-size:2.2rem; font-weight:700; margin-bottom:8px; }
        .fc-pinyin { font-size:1.1rem; font-style:italic; margin-bottom:16px; opacity:0.9; }
        .fc-viet, .fc-meaning { display:none; font-size:1.1rem; margin-top:12px; }

        .status { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:white; padding:12px 24px; border-radius:50px; box-shadow:0 10px 25px rgba(0,0,0,.15); font-weight:500; display:flex; gap:10px; align-items:center; opacity:0; transition:var(--t); z-index:999; }
        .status.show { opacity:1; }
        .status.loading { color:var(--p); }
        .status.success { color:var(--s); }
        .status.error { color:var(--d); }
        .spin { width:18px; height:18px; border:2px solid #f3f3f3; border-top:2px solid currentColor; border-radius:50%; animation:s 1s linear infinite; display:none; }
        @keyframes s { to{transform:rotate(360deg)} }

        /* UPLOAD & EXPORT NGANG HÀNG */
        .csv-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:12px; }
        .csv-actions .upload { flex:1; min-width:200px; padding:16px; border:2px dashed var(--g2); border-radius:12px; text-align:center; cursor:pointer; }
        .csv-actions button { flex:1; min-width:140px; }

        @media (max-width:1024px) { .grid, .fc-grid-3, .fc-grid-6 { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:768px) { .nav { flex-direction:column; } .grid, .fc-grid-3, .fc-grid-6 { grid-template-columns:1fr; } }
        @media (max-width: 480px) {
            .h1 { font-size: 2rem; }
            .fc-chinese { font-size: 1.8rem; }
            .card { padding: 16px; min-height: 120px; }
            .fc { padding: 24px; min-height: 160px; }
        }
        @media all and (display-mode: standalone) {
            body { padding-top: env(safe-area-inset-top); }
        }
    </style>
</head>
<body>
<div class="c">
    <h1 class="h1">Học Tiếng Trung Pro</h1>
    <div class="nav">
        <button class="tab active" data-page="lib" onclick="show('lib')">Thư viện</button>
        <button class="tab" data-page="add" onclick="show('add')">Thêm từ</button>
        <button class="tab" data-page="fc" onclick="show('fc')">Flashcard</button>
        <button class="tab" data-page="sheets" onclick="show('sheets')">Sheets</button>
    </div>

    <!-- Library -->
    <div id="lib" class="page active">
        <div class="stats">
            <div class="stat"><span class="n" id="total">0</span> Tổng</div>
            <div class="stat"><span class="n" id="learned">0</span> Đã học</div>
            <div class="stat"><span class="n" id="topics">0</span> Chủ đề</div>
        </div>
        <div class="filters" id="filters"></div>
        <div class="grid" id="list"></div>
    </div>

    <!-- Add Word -->
    <div id="add" class="page">
        <h2>Tra cứu & Thêm từ</h2>
        <input type="text" id="search-input" placeholder="Nhập tiếng Việt, tiếng Anh..." style="width:100%;padding:12px;border:2px solid var(--g2);border-radius:12px;margin-bottom:12px">
        <div style="display:flex;gap:8px;margin-bottom:12px">
            <button class="btn" onclick="search('vi')">Tiếng Việt</button>
            <button class="btn" onclick="search('en')">Tiếng Anh</button>
            <button class="btn" onclick="search('auto')">Tự động</button>
        </div>
        <div id="sugg" style="margin-top:20px"></div>

        <div style="margin-top:20px">
            <select id="topic" style="width:100%;padding:12px;border:2px solid var(--g2);border-radius:12px;margin-bottom:8px">
                <option value="">Chọn chủ đề...</option>
            </select>
            <div style="display:flex;gap:8px">
                <input type="text" id="newti" placeholder="Tên chủ đề mới..." style="flex:1;padding:12px;border:2px solid var(--g2);border-radius:12px">
                <button class="btn" onclick="createTopic()">Tạo</button>
            </div>
        </div>
    </div>

    <!-- Flashcard -->
    <div id="fc" class="page">
        <h2>Flashcard</h2>
        <div style="display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;align-items:center">
            <select id="fc-topic" onchange="fcTopic=this.value; localStorage.setItem('fc_topic',this.value); updateFlashcards()" style="padding:12px;border:2px solid var(--g2);border-radius:12px"></select>
            <div style="display:flex;gap:8px">
                <button class="layout-btn" onclick="setLayout(3)">3</button>
                <button class="layout-btn active" onclick="setLayout(6)">6</button>
            </div>
            <button class="btn" onclick="nextCards()">Thẻ mới</button>
            <button class="btn" onclick="markLearned()">Đã học</button>
        </div>
        <div id="fc-container" class="fc-grid-6"></div>
    </div>

    <!-- Sheets -->
    <div id="sheets" class="page">
        <h2>Google Sheets</h2>
        <div style="background:#ecfdf5;padding:20px;border-radius:12px;margin:20px 0">
            <h3>Upload & Export CSV</h3>
            <div class="csv-actions">
                <div class="upload" id="csv-drop">
                    <p>Kéo thả CSV hoặc <strong>chọn file</strong></p>
                    <input type="file" id="csv-file" accept=".csv" style="display:none">
                </div>
                <button class="btn" onclick="$('csv-file').click()">Chọn CSV</button>
                <button class="btn" onclick="exportCSV()">Export CSV</button>
            </div>
        </div>
        <div style="background:#f0f9ff;padding:20px;border-radius:12px">
            <h3>Import Public Sheet</h3>
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px">
                <input type="text" id="sheet-id" placeholder="Nhập Sheet ID..." style="flex:1;min-width:200px;padding:12px;border:2px solid var(--g2);border-radius:12px">
                <button class="btn" onclick="importPublic()">Import</button>
            </div>
        </div>
    </div>
</div>

<div id="status" class="status"><div class="spin" id="sspin"></div><span id="stxt">Sẵn sàng</span></div>

<script>
// === CẤU HÌNH ===
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbyMlgl6tJdTQfZ8PjZmtqnPWzOqYЩ_tmqTbUhE7ZrXaxBzyj4Cmyj5yw1pnHNYfxJ_GSnw/exec';
const DEFAULT_SHEET_ID = '1b0rr7I0Z1gVc9o4pR8-0RpWC-pdtNwjasD_hEZ2Wuxw';
const CORS_PROXY = 'https://api.allorigins.win/get?url=';

let vocab = JSON.parse(localStorage.getItem('cn_vocab') || '[]') || [];
let filter = 'all', layout = 6, fcTopic = localStorage.getItem('fc_topic') || 'all', prevCards = [], currentCards = [];

// === FALLBACK DICTIONARY (offline) ===
const FALLBACK_DICT = {
    "bóng đá": { chinese: "足球", pinyin: "zú qiú", meaning: "football" },
    "dưa hấu": { chinese: "西瓜", pinyin: "xī guā", meaning: "watermelon" },
    "máy bay": { chinese: "飞机", pinyin: "fēi jī", meaning: "airplane" },
    "xin chào": { chinese: "你好", pinyin: "nǐ hǎo", meaning: "hello" },
    "cảm ơn": { chinese: "谢谢", pinyin: "xiè xie", meaning: "thank you" }
};

function $(id) { return document.getElementById(id); }

// === NAVIGATION ===
function show(p) {
    document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
    $(p).classList.add('active');
    document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
    const t = document.querySelector(`.tab[data-page="${p}"]`);
    if (t) t.classList.add('active');

    if (p === 'lib') renderLibrary();
    else if (p === 'add') updateAddTopicList();
    else if (p === 'fc') updateFlashcards();
    else if (p === 'sheets') {}
}

// === STATUS ===
function status(txt, type='loading') {
    const b = $('status'), sp = $('sspin'), tx = $('stxt');
    tx.textContent = txt; b.className = `status ${type}`;
    sp.style.display = type === 'loading' ? 'inline-block' : 'none';
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 3000);
}
function save() { localStorage.setItem('cn_vocab', JSON.stringify(vocab)); }

// === EXPORT CSV ===
function exportCSV() {
    if (vocab.length === 0) return status('Không có từ để export', 'error');
    const header = ['Vietnamese','Chinese','Pinyin','Meaning','Topic','Difficulty','Learned'];
    const rows = vocab.map(w => [
        w.vietnamese, w.chinese, w.pinyin, w.meaning, w.topic, w.difficulty, w.learned ? 'TRUE' : 'FALSE'
    ]);
    const csv = [header, ...rows].map(r => r.map(c => `"${(c+'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `vocab_export_${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
    status('Đã export CSV!', 'success');
}

// === AUTO IMPORT ===
async function autoImport() {
    status('Đang cập nhật từ Sheet...');
    try {
        const res = await fetch(`${PROXY_URL}?id=${DEFAULT_SHEET_ID}`);
        if (!res.ok) throw 'Lỗi mạng';
        const csv = await res.text();
        const rows = parseCSV(csv).slice(1);
        let added = 0;
        rows.forEach(r => {
            if (r.length < 2) return;
            const chi = r[1].trim();
            if (chi && !vocab.some(v => v.chinese === chi)) {
                const py = r[2] ? r[2].trim() : pinyinPro.pinyin(chi, { tone: 'num' });
                vocab.push({
                    id: Date.now() + added++,
                    vietnamese: r[0].trim(),
                    chinese: chi,
                    pinyin: py,
                    meaning: r[3].trim(),
                    topic: r[4].trim() || 'Imported',
                    difficulty: (r[5] || 'easy').trim().toLowerCase(),
                    learned: (r[6] || 'FALSE').toUpperCase() === 'TRUE'
                });
            }
        });
        if (added > 0) { save(); renderLibrary(); status(`Cập nhật ${added} từ mới!`, 'success'); }
        else status('Đã cập nhật (không có từ mới)', 'success');
    } catch (e) { status('Lỗi: ' + e, 'error'); }
}

// === RENDER LIBRARY ===
function renderLibrary() {
    $('total').textContent = vocab.length;
    $('learned').textContent = vocab.filter(w => w.learned).length;
    $('topics').textContent = new Set(vocab.map(w => w.topic)).size;

    const topics = ['all', ...new Set(vocab.map(w => w.topic))];
    $('filters').innerHTML = topics.map(t => `
        <button class="fbtn ${filter===t?'active':''}" onclick="setFilter('${t}')">
            ${t==='all'?'Tất cả':t} <small>(${t==='all'?vocab.length:vocab.filter(w=>w.topic===t).length})</small>
        </button>
    `).join('');

    const data = filter === 'all' ? vocab : vocab.filter(w => w.topic === filter);
    $('list').innerHTML = data.map(w => `
        <div class="card">
            <button class="play" onclick="speak('${w.chinese}')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11-5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div style="flex:1">
                <div style="font-size:1.6rem;font-weight:700">${w.chinese}</div>
                <div style="color:var(--p);font-style:italic;font-size:.9rem">${w.pinyin}</div>
                <div style="color:var(--g6);font-size:.9rem;margin:4px 0">${w.vietnamese} - ${w.meaning}</div>
                <div style="display:flex;gap:6px;font-size:.75rem">
                    <span style="background:#e6f7ff;color:#0969da;padding:2px 8px;border-radius:12px">${w.topic}</span>
                    <span style="background:${w.difficulty==='easy'?'#d1fae5':'#fee2e2'};color:${w.difficulty==='easy'?'#065f46':'#991b1b'};padding:2px 8px;border-radius:12px">${w.difficulty}</span>
                </div>
            </div>
        </div>
    `).join('') || '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--g6)">Chưa có từ</div>';
}
function setFilter(f) { filter = f; renderLibrary(); }

// === TÌM KIẾM ONLINE + FALLBACK OFFLINE ===
async function search(mode) {
    const q = $('search-input').value.trim();
    if (!q) return status('Nhập từ', 'error');
    status('Đang tra...');

    let result = { chinese: '', pinyin: '', meaning: q };

    // Fallback offline trước
    const fallbackKey = Object.keys(FALLBACK_DICT).find(key => q.toLowerCase().includes(key));
    if (fallbackKey) {
        result = { ...FALLBACK_DICT[fallbackKey], meaning: q };
    }

    // Online: Google Translate với proxy CORS
    if (!result.chinese && (mode === 'vi' || mode === 'auto')) {
        try {
            const url = encodeURIComponent(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=zh-CN&dt=t&q=${encodeURIComponent(q)}`);
            const res = await fetch(`${CORS_PROXY}${url}`);
            if (res.ok) {
                const proxyData = await res.json();
                const data = JSON.parse(proxyData.contents);
                if (data?.[0]?.[0]?.[0]) {
                    result.chinese = data[0][0][0];
                }
            }
        } catch (e) { console.log('Google lỗi:', e); }
    }

    if (!result.chinese && (mode === 'en' || mode === 'auto')) {
        try {
            const url = encodeURIComponent(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=${encodeURIComponent(q)}`);
            const res = await fetch(`${CORS_PROXY}${url}`);
            if (res.ok) {
                const proxyData = await res.json();
                const data = JSON.parse(proxyData.contents);
                if (data?.[0]?.[0]?.[0]) {
                    result.chinese = data[0][0][0];
                }
            }
        } catch (e) { console.log('Google EN lỗi:', e); }
    }

    // Tạo Pinyin
    if (result.chinese && !result.pinyin) {
        result.pinyin = pinyinPro.pinyin(result.chinese, { tone: 'num' }).replace(/ /g, ' ');
    }

    if (result.chinese) {
        showResult(result, q);
        status('Tìm thấy!', 'success');
    } else {
        status('Không tìm thấy (kiểm tra mạng)', 'error');
    }
}

function showResult(res, viet) {
    $('sugg').innerHTML = `
        <div style="border:1px solid var(--g2);padding:20px;border-radius:16px;margin:12px 0;background:#f8f9fa">
            <div style="font-size:2rem;font-weight:700;color:var(--p)">${res.chinese}</div>
            <div style="color:#667eea;font-style:italic;margin:8px 0;font-size:1.1rem">${res.pinyin || '—'}</div>
            <div style="color:var(--g6);font-size:1rem">${viet} → ${res.meaning}</div>
            <div style="margin-top:16px;display:flex;gap:8px">
                <button class="btn" onclick="addWord('${res.chinese.replace(/'/g, "\\'")}','${(res.pinyin||'').replace(/'/g, "\\'")}','${res.meaning}','${viet}')">
                    Thêm vào thư viện
                </button>
            </div>
        </div>`;
}

// === FLASHCARD ===
function updateAddTopicList() {
    const s = $('topic');
    const topics = Array.from(new Set(vocab.map(w => w.topic))).sort();
    s.innerHTML = '<option value="">Chọn chủ đề...</option>' + 
        topics.map(t => `<option value="${t}">${t}</option>`).join('');
}
function createTopic() {
    const name = $('newti').value.trim();
    if (!name) return status('Nhập tên chủ đề', 'error');
    const s = $('topic');
    const o = document.createElement('option'); o.value = name; o.textContent = name; o.selected = true;
    s.appendChild(o);
    $('newti').value = '';
    status('Tạo chủ đề thành công!', 'success');
}

function updateFlashcards() {
    const topics = ['all', ...new Set(vocab.map(w => w.topic))];
    const sel = $('fc-topic');
    sel.innerHTML = topics.map(t => `<option value="${t}" ${fcTopic===t?'selected':''}>${t==='all'?'Tất cả':t}</option>`).join('');
    generateCards(); renderCards();
}
function setLayout(l) {
    layout = l;
    document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    $('fc-container').className = `fc-grid-${l}`;
    updateFlashcards();
}
function generateCards() {
    let pool = vocab.filter(w => !w.learned);
    if (fcTopic !== 'all') pool = pool.filter(w => w.topic === fcTopic);
    if (pool.length === 0) { currentCards = []; return; }
    let remaining = pool.filter(w => !prevCards.some(p => p.id === w.id));
    if (remaining.length < layout) { remaining = pool; prevCards = []; }
    currentCards = [...remaining].sort(() => Math.random() - 0.5).slice(0, layout);
    prevCards = [...prevCards, ...currentCards].slice(-20);
}
function renderCards() {
    const c = $('fc-container');
    if (currentCards.length === 0) { c.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:white">Đã học hết!</div>`; return; }
    c.innerHTML = currentCards.map((w, i) => `
        <div class="fc" onclick="flipAndSpeak(${i})" id="fc-${i}">
            <div class="fc-chinese">${w.chinese}</div>
            <div class="fc-pinyin">${w.pinyin}</div>
            <div class="fc-viet" style="display:none;">${w.vietnamese}</div>
            <div class="fc-meaning" style="display:none;">${w.meaning}</div>
        </div>
    `).join('');
}
function flipAndSpeak(i) {
    const f = $(`fc-${i}`), v = f.querySelector('.fc-viet'), m = f.querySelector('.fc-meaning');
    const show = v.style.display !== 'block';
    v.style.display = show ? 'block' : 'none';
    m.style.display = show ? 'block' : 'none';
    f.classList.toggle('showing-answer', show);
    speak(currentCards[i].chinese);
}
function nextCards() { generateCards(); renderCards(); status('Bộ thẻ mới!', 'success'); }
function markLearned() {
    let count = 0;
    currentCards.forEach(w => {
        const item = vocab.find(v => v.id === w.id);
        if (item && !item.learned) { item.learned = true; count++; }
    });
    save(); renderLibrary(); updateFlashcards(); status(`Đánh dấu ${count} từ`, 'success');
}

function speak(text) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    speechSynthesis.speak(u);
}

// === CSV & SHEETS ===
const dropZone = $('csv-drop');
['dragenter','dragover','dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => ev.preventDefault()));
['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover')));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover')));
dropZone.addEventListener('drop', e => e.dataTransfer.files[0] && handleCSV(e.dataTransfer.files[0]));
$('csv-file').addEventListener('change', e => e.target.files[0] && handleCSV(e.target.files[0]));

async function handleCSV(file) {
    status('Đang đọc CSV...');
    try {
        const text = await file.text();
        const rows = parseCSV(text).slice(1);
        let added = 0;
        rows.forEach(r => {
            if (r.length < 2) return;
            const chi = r[1].trim();
            if (chi && !vocab.some(v => v.chinese === chi)) {
                const py = r[2] ? r[2].trim() : pinyinPro.pinyin(chi, { tone: 'num' });
                vocab.push({
                    id: Date.now() + added++,
                    vietnamese: r[0].trim(),
                    chinese: chi,
                    pinyin: py,
                    meaning: r[3].trim(),
                    topic: r[4].trim() || 'CSV',
                    difficulty: (r[5] || 'easy').trim().toLowerCase(),
                    learned: (r[6] || 'FALSE').toUpperCase() === 'TRUE'
                });
            }
        });
        save(); renderLibrary(); status(`Đã thêm ${added} từ!`, 'success');
    } catch (e) { status('Lỗi đọc CSV', 'error'); }
}

function parseCSV(text) {
    const lines = text.split('\n');
    return lines.map(line => {
        const result = [];
        let field = '';
        let inQuote = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') inQuote = !inQuote;
            else if (c === ',' && !inQuote) { result.push(field); field = ''; }
            else field += c;
        }
        result.push(field);
        return result;
    });
}

async function importPublic() {
    const id = $('sheet-id').value.trim();
    if (!id) return status('Nhập ID', 'error');
    status('Đang import...');
    try {
        const res = await fetch(`${PROXY_URL}?id=${id}`);
        if (!res.ok) throw 'Lỗi';
        const csv = await res.text();
        const rows = parseCSV(csv).slice(1);
        let added = 0;
        rows.forEach(r => {
            if (r.length < 2) return;
            const chi = r[1].trim();
            if (chi && !vocab.some(v => v.chinese === chi)) {
                const py = r[2] ? r[2].trim() : pinyinPro.pinyin(chi, { tone: 'num' });
                vocab.push({
                    id: Date.now() + added++,
                    vietnamese: r[0].trim(),
                    chinese: chi,
                    pinyin: py,
                    meaning: r[3].trim(),
                    topic: r[4].trim() || 'Sheet',
                    difficulty: (r[5] || 'easy').trim().toLowerCase(),
                    learned: (r[6] || 'FALSE').toUpperCase() === 'TRUE'
                });
            }
        });
        save(); renderLibrary(); status(`Đã import ${added} từ!`, 'success');
    } catch (e) { status('Lỗi import', 'error'); }
}

function addWord(c, p, m, v) {
    const t = $('topic').value || prompt('Chủ đề:');
    if (!t) return status('Chọn chủ đề', 'error');
    if (!vocab.some(v => v.chinese === c)) {
        vocab.push({id: Date.now(), vietnamese: v, chinese: c, pinyin: p, meaning: m, topic: t, difficulty: 'easy', learned: false});
        save(); renderLibrary(); show('lib'); status('Đã thêm!', 'success');
    } else status('Từ đã tồn tại', 'error');
}
