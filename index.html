<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

    <style>
        :root { --p: #667eea; --pd: #764ba2; --s: #48bb78; --d: #f56565; --w: #f59e0b; --g1: #f8f9fa; --g2: #e2e8f0; --g6: #4a5568; --g8: #2d3748; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: system-ui; background: linear-gradient(135deg, var(--p), var(--pd)); min-height:100vh; color:var(--g8); }
        .c { max-width:1200px; margin:auto; padding:16px; }
        .h1 { text-align:center; color:white; font-size:2.5rem; margin-bottom:8px; text-shadow:0 2px 4px rgba(0,0,0,.3); }
        .nav { display:flex; background:white; border-radius:16px; padding:8px; margin-bottom:32px; box-shadow:0 10px 25px rgba(0,0,0,.15); gap:8px; flex-wrap:wrap; }
        .tab { flex:1; min-width:110px; padding:14px; text-align:center; border:none; border-radius:12px; font-weight:600; color:var(--g6); cursor:pointer; transition:all .3s; }
        .tab.active { background:linear-gradient(135deg,var(--p),var(--pd)); color:white; }
        .page { display:none; background:white; border-radius:16px; padding:32px; box-shadow:0 10px 25px rgba(0,0,0,.15); animation:f .4s; }
        .page.active { display:block; } @keyframes f { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none} }

        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .fc-grid-6 { display:grid; gap:20px; grid-template-columns:repeat(3,1fr); }

        .stats { display:flex; gap:20px; font-size:.95rem; color:var(--g6); margin-bottom:24px; flex-wrap:wrap; }
        .stat { display:flex; align-items:center; gap:6px; background:var(--g1); padding:8px 14px; border-radius:20px; font-weight:500; }
        .n { font-weight:700; color:var(--p); }

        .filters { display:flex; flex-wrap:wrap; gap:10px; padding:16px; background:var(--g1); border-radius:12px; margin-bottom:24px; }
        .fbtn { padding:8px 16px; border:2px solid var(--g2); background:white; border-radius:20px; font-size:.9rem; cursor:pointer; transition:all .3s; }
        .fbtn.active { background:var(--p); color:white; border-color:var(--p); }

        .card { background:white; border:1px solid var(--g2); border-radius:16px; padding:20px; position:relative; transition:all .3s; display:flex; flex-direction:column; justify-content:space-between; min-height:140px; }
        .card:hover { transform:translateY(-4px); box-shadow:0 10px 25px rgba(0,0,0,.15); }
        .card .play { background:rgba(102,126,234,.1); border:none; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .3s; font-size:1.2rem; }
        .card .play:hover { background:var(--p); color:white; }

        .btn { padding:12px 24px; border:none; border-radius:12px; font-weight:600; cursor:pointer; display:inline-flex; gap:8px; align-items:center; transition:all .3s; background:linear-gradient(135deg,var(--p),var(--pd)); color:white; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(102,126,234,.3); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; }

        .fc { background:linear-gradient(135deg,var(--p),var(--pd)); color:white; border-radius:20px; padding:32px; cursor:pointer; min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 8px 25px rgba(0,0,0,.15); transition:all .3s; position:relative; }
        .fc:hover { transform:scale(1.02); }
        .fc.showing-answer { background:linear-gradient(135deg,var(--s),#38a169); }
        .fc-chinese { font-size:2.2rem; font-weight:700; margin-bottom:8px; }
        .fc-pinyin { font-size:1.1rem; font-style:italic; margin-bottom:16px; opacity:0.9; }
        .fc-viet { display:none; font-size:1.1rem; margin-top:12px; }

        .input-field { width:100%; padding:14px 16px; border:2px solid var(--g2); border-radius:12px; font-size:1rem; margin-bottom:12px; }

        .status { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:white; padding:12px 24px; border-radius:50px; box-shadow:0 10px 25px rgba(0,0,0,.15); font-weight:500; opacity:0; transition:all .3s; z-index:999; }
        .status.show { opacity:1; }
        .status.success { color:var(--s); }
        .status.error { color:var(--d); }
        .spin { width:18px; height:18px; border:2px solid #f3f3f3; border-top:2px solid currentColor; border-radius:50%; animation:s 1s linear infinite; display:none; }
        @keyframes s { to{transform:rotate(360deg)} }

        .config-section { background:#e0e7ff; padding:20px; border-radius:12px; margin:20px 0; }
        .manual-section { background:#fef3c7; padding:20px; border-radius:12px; margin:20px 0; }
        .manual-section label { display:block; font-weight:600; margin-bottom:6px; color:var(--g8); }

        .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); }
        .modal.show { display:flex; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:40px; border-radius:20px; max-width:600px; width:90%; }
        .stroke-container { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:20px 0; }
        .stroke-char { width:200px; height:200px; }

        @media (max-width:768px) { 
            .grid, .fc-grid-6 { grid-template-columns:1fr; }
            .stroke-char { width:150px; height:150px; }
            .nav { padding:6px; gap:4px; }
            .tab { min-width:80px; padding:10px 8px; font-size:0.85rem; }
            .stats { gap:10px; font-size:0.85rem; }
            .stat { padding:6px 10px; }
            .filters { gap:6px; padding:12px; }
            .fbtn { padding:6px 12px; font-size:0.8rem; }
            .card { padding:16px; min-height:120px; }
            .card .play { width:32px; height:32px; font-size:1rem; }
            .fc { padding:24px 16px; min-height:180px; }
            .fc-chinese { font-size:1.8rem; }
            .fc-pinyin { font-size:1rem; }
            .fc-viet { font-size:1rem; }
            .btn { padding:10px 16px; font-size:0.9rem; }
            .input-field { padding:12px 14px; font-size:0.95rem; }
            .modal-content { padding:24px 16px; width:95%; }
            .stroke-container { gap:12px; }
            .stroke-char { width:140px; height:140px; }
            .page { padding:20px 16px; }
            .c { padding:12px; }
            .h1 { font-size:1.8rem; }
            h2 { font-size:1.3rem; }
            h3 { font-size:1.1rem; }
            .config-section, .manual-section { padding:16px; }
            .grid { gap:16px; }
        }
    </style>
</head>
<body>
<div class="c">
    <h1 class="h1">Học Tiếng Trung Pro</h1>
    <div class="nav">
        <button class="tab active" onclick="show('lib', this)">Thư viện</button>
        <button class="tab" onclick="show('add', this)">Thêm từ</button>
        <button class="tab" onclick="show('fc', this)">Flashcard</button>
        <button class="tab" onclick="show('config', this)">Cấu hình</button>
    </div>

    <div id="lib" class="page active">
        <div class="stats">
            <div class="stat">Tổng <span class="n" id="total">0</span></div>
            <div class="stat">Đã học <span class="n" id="learned">0</span></div>
            <div class="stat">Chủ đề <span class="n" id="topics">0</span></div>
        </div>
        <input type="text" id="lib-search" class="input-field" placeholder="Tìm kiếm...">
        <div class="filters" id="filters"></div>
        <div class="grid" id="list"></div>
    </div>

    <div id="add" class="page">
        <h2>Thêm từ vựng</h2>
        <div class="manual-section">
            <h3 style="margin-bottom:16px">Nhập thông tin từ vựng</h3>
            <p style="color:var(--g6);font-size:0.9rem;margin-bottom:20px">
                Tip: Paste tiếng Trung → Pinyin tự động!
            </p>
            <label>Tiếng Việt <span style="color:red">*</span></label>
            <input type="text" id="manual-vi" class="input-field" placeholder="VD: bệnh viện">
            <label>Tiếng Trung <span style="color:red">*</span></label>
            <input type="text" id="manual-zh" class="input-field" placeholder="VD: 医院">
            <label>Pinyin <span style="color:var(--s);font-size:0.85rem" id="pinyin-status">Tự động</span></label>
            <input type="text" id="manual-py" class="input-field" placeholder="VD: yi1 yuan4" readonly style="background:#f0f9ff">
            <div style="font-size:0.8rem;color:var(--g6);margin-top:4px">Pinyin tự động khi nhập tiếng Trung</div>
            <label>English <span style="color:var(--g6)">(tùy chọn)</span></label>
            <input type="text" id="manual-en" class="input-field" placeholder="VD: hospital">
            <button class="btn" id="manual-add-btn" style="width:100%;margin-top:8px;font-size:1.1rem">Thêm vào thư viện</button>
        </div>
        <div style="margin-top:20px">
            <label style="display:block;font-weight:600;margin-bottom:8px">Chủ đề</label>
            <select id="topic" class="input-field">
                <option value="">Chọn chủ đề...</option>
            </select>
            <div style="display:flex;gap:8px;margin-top:8px">
                <input type="text" id="newti" placeholder="Tên chủ đề mới..." class="input-field" style="margin:0;flex:1">
                <button class="btn" onclick="createTopic()">Tạo</button>
            </div>
        </div>
    </div>

    <div id="fc" class="page">
        <h2>Flashcard</h2>
        <div style="display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;align-items:center">
            <select id="fc-topic" onchange="fcTopic=this.value;updateFlashcards()" class="input-field" style="flex:1;margin:0"></select>
            <button class="btn" onclick="togglePinyin()" id="pinyin-toggle-btn">Hiện Pinyin</button>
            <button class="btn" onclick="nextCards()">Thẻ mới</button>
        </div>
        <div id="fc-container" class="fc-grid-6"></div>
    </div>

    <div id="config" class="page">
        <h2>Cấu hình</h2>
        <div class="config-section">
            <h3>GitHub Sync</h3>
            <input type="text" id="github-token" placeholder="GitHub Personal Access Token" class="input-field">
            <input type="text" id="github-repo" placeholder="username/repo-name" class="input-field">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn" onclick="saveGitHubConfig()">Lưu</button>
                <button class="btn" onclick="syncToGitHub()">Sync ngay</button>
            </div>
        </div>
        <div class="config-section">
            <h3>Google Sheets</h3>
            <input type="text" id="default-sheet-id" placeholder="Sheet ID..." class="input-field">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn" onclick="saveDefaultSheet()">Lưu</button>
                <button class="btn" onclick="loadFromSheet()">Load</button>
            </div>
            <p style="margin-top:12px;font-size:0.85rem;color:var(--g6)">Sheet: <span id="current-sheet">Chưa cấu hình</span></p>
        </div>
        <div style="background:#ecfdf5;padding:20px;border-radius:12px;margin:20px 0">
            <h3>Dữ liệu</h3>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
                <button class="btn" onclick="exportCSV()">CSV</button>
                <button class="btn" onclick="downloadVocabJSON()">vocab.json</button>
                <button class="btn" style="background:var(--d)" onclick="clearAll()">Xóa</button>
            </div>
        </div>
    </div>
</div>

<div id="stroke-modal" class="modal">
    <div class="modal-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h2>Cách viết chữ Hán</h2>
            <button class="btn" onclick="closeStrokeModal()" style="padding:8px 16px">X</button>
        </div>
        <div id="stroke-word" style="font-size:1.5rem;text-align:center;margin-bottom:20px;color:var(--g6)"></div>
        <div class="stroke-container" id="stroke-container"></div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:20px">
            <button class="btn" onclick="animateStrokes()">Chạy lại</button>
            <button class="btn" onclick="quizStrokes()">Luyện viết</button>
        </div>
    </div>
</div>

<div id="status" class="status">
    <div class="spin"></div>
    <span id="status-msg"></span>
</div>

<script>
const SEARCH_SUGGESTIONS = ['bệnh viện', 'máy bay', 'máy tính', 'điện thoại', 'nhà hàng', 'sân bay'];

let vocab = [];
let defaultSheetId = localStorage.getItem('default_sheet_id') || '';
let githubToken = localStorage.getItem('github_token') || '';
let githubRepo = localStorage.getItem('github_repo') || '';
let filterTopic = 'all';
let fcTopic = 'all';
let currentCards = [];
let currentStrokeWord = '';
let showPinyinInFlashcard = true;

const $ = id => document.getElementById(id);

// === UTILS ===
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function generatePinyin(chinese) {
    if (!chinese) return '';
    try {
        if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
            return pinyinPro.pinyin(chinese, { toneType: 'num' }) || chinese;
        }
    } catch (e) {
        console.error('Pinyin error:', e);
    }
    return chinese;
}

function status(msg, type = 'loading') {
    const s = $('status'), spin = s.querySelector('.spin');
    $('status-msg').textContent = msg;
    s.className = `status show ${type}`;
    spin.style.display = type === 'loading' ? 'inline-block' : 'none';
    if (type !== 'loading') setTimeout(() => s.classList.remove('show'), 3000);
}

function save() {
    localStorage.setItem('vocab', JSON.stringify(vocab));
    if (githubToken && githubRepo) syncToGitHub();
}

// === SHOW TAB ===
function show(page, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    $(page).classList.add('active');
    btn.classList.add('active');

    if (page === 'lib') renderLibrary();
    if (page === 'add') updateAddTopicList();
    if (page === 'fc') updateFlashcards();
    if (page === 'config') { updateSheetDisplay(); updateGitHubDisplay(); }
}

// === ADD WORD ===
document.addEventListener('DOMContentLoaded', () => {
    const zhInput = $('manual-zh');
    const pyInput = $('manual-py');
    const pyStatus = $('pinyin-status');

    zhInput.addEventListener('input', () => {
        const zh = zhInput.value.trim();
        if (!zh) {
            pyInput.value = '';
            pyInput.style.background = '#f0f9ff';
            pyStatus.textContent = 'Tự động';
            return;
        }
        pyStatus.textContent = 'Đang tạo...';
        pyInput.style.background = '#fff9e6';

        clearTimeout(window.pinyinTimeout);
        window.pinyinTimeout = setTimeout(() => {
            const py = generatePinyin(zh);
            pyInput.value = py;
            pyInput.style.background = py !== zh ? '#e6f7ed' : '#fee';
            pyStatus.textContent = py !== zh ? 'Đã tạo' : 'Lỗi';
        }, 300);
    });

    $('manual-add-btn').addEventListener('click', addManualWord);
});

function addManualWord() {
    const vi = $('manual-vi').value.trim();
    const zh = $('manual-zh').value.trim();
    let py = $('manual-py').value.trim();
    const en = $('manual-en').value.trim();
    const topic = $('topic').value || 'Tự thêm';

    if (!vi || !zh) return status('Nhập đầy đủ!', 'error');
    if (!py || py === zh) {
        const gen = generatePinyin(zh);
        if (gen && gen !== zh) {
            $('manual-py').value = gen;
            setTimeout(addManualWord, 500);
            return;
        } else {
            return status('Pinyin lỗi!', 'error');
        }
    }
    if (vocab.some(w => w.chinese === zh)) return status('Đã tồn tại!', 'error');

    vocab.push({
        id: crypto.randomUUID?.() || Date.now() + Math.random(),
        vietnamese: vi,
        chinese: zh,
        pinyin: py,
        meaning: en || vi,
        topic: topic,
        difficulty: 'easy',
        learned: false,
        nextReview: Date.now(),
        reviewCount: 0
    });

    save();
    $('manual-vi').value = $('manual-zh').value = $('manual-py').value = $('manual-en').value = '';
    $('manual-py').style.background = '#f0f9ff';
    $('pinyin-status').textContent = 'Tự động';
    status('Đã thêm!', 'success');
    setTimeout(() => document.querySelector('.tab').click(), 1000);
}

// === TOPIC ===
function createTopic() {
    const name = $('newti').value.trim();
    if (!name) return status('Nhập tên!', 'error');
    if ($('topic').querySelector(`option[value="${name}"]`)) return status('Đã tồn tại!', 'error');
    const opt = new Option(name, name);
    $('topic').add(opt);
    $('topic').value = name;
    $('newti').value = '';
    status('Đã tạo!', 'success');
}

function updateAddTopicList() {
    const topics = [... neuen Set(vocab.map(w => w.topic))];
    $('topic').innerHTML = '<option value="">Chọn chủ đề...</option>' +
        topics.map(t => `<option value="${t}">${t}</option>`).join('');
}

// === STROKE ORDER ===
function showStrokeOrder(chinese, vietnamese) {
    currentStrokeWord = chinese;
    const pinyin = generatePinyin(chinese);
    $('stroke-word').textContent = `${pinyin} - ${vietnamese}`;
    $('stroke-modal').classList.add('show');
    const container = $('stroke-container');
    container.innerHTML = '';

    chinese.split('').forEach((char, i) => {
        const div = document.createElement('div');
        div.id = `char-${i}`;
        div.className = 'stroke-char';
        container.appendChild(div);
        try {
            const writer = HanziWriter.create(`char-${i}`, char, {
                width: 200, height: 200, padding: 5, showOutline: true
            });
            window[`writer${i}`] = writer;
            writer.animateCharacter();
        } catch (e) {
            div.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--g6)">Không hỗ trợ</div>';
        }
    });
}

function closeStrokeModal() { $('stroke-modal').classList.remove('show'); }
function animateStrokes() { currentStrokeWord.split('').forEach((_, i) => window[`writer${i}`]?.animateCharacter()); }
function quizStrokes() { currentStrokeWord.split('').forEach((_, i) => window[`writer${i}`]?.quiz()); status('Hãy viết theo nét!', 'success'); }

// === LIBRARY ===
$('lib-search').addEventListener('input', () => {
    clearTimeout(window.searchTimeout);
    window.searchTimeout = setTimeout(() => renderLibrary($('lib-search').value), 300);
});

function renderLibrary(q = '') {
    let list = vocab;
    if (q) list = list.filter(w => [w.vietnamese, w.chinese, w.pinyin].some(f => f.toLowerCase().includes(q.toLowerCase())));
    if (filterTopic !== 'all') list = list.filter(w => w.topic === filterTopic);

    $('total').textContent = vocab.length;
    $('learned').textContent = vocab.filter(w => w.learned).length;
    $('topics').textContent = [...new Set(vocab.map(w => w.topic))].length;

    $('filters').innerHTML = `<div class="fbtn ${filterTopic==='all'?'active':''}" onclick="filterTopic='all';renderLibrary()">Tất cả</div>` +
        [...new Set(vocab.map(w => w.topic))].map(t => `<div class="fbtn ${filterTopic===t?'active':''}" onclick="filterTopic='${t}';renderLibrary()">${t}</div>`).join('');

    const el = $('list');
    if (!list.length) {
        el.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px"><div style="font-size:3rem">Empty</div><h3>Chưa có từ</h3><p>Thêm từ mới!</p></div>`;
        return;
    }

    el.innerHTML = list.map(w => `
        <div class="card">
            <div style="display:flex;gap:12px">
                <div style="flex:1">
                    <div style="font-size:1.8rem;font-weight:700">${escapeHtml(w.chinese)}</div>
                    <div style="color:var(--g6);font-size:.9rem;font-style:italic">${w.pinyin}</div>
                    <div style="font-weight:600">${escapeHtml(w.vietnamese)}</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
                    <button class="play" onclick="event.stopPropagation();showStrokeOrder('${escapeHtml(w.chinese)}','${escapeHtml(w.vietnamese)}')" title="Viết">Write</button>
                    <button class="play" onclick="event.stopPropagation();speak('${escapeHtml(w.chinese)}')" title="Nghe">Hear</button>
                    <button onclick="event.stopPropagation();toggleLearned(${w.id})" style="background:none;border:none;font-size:1.3rem">
                        ${w.learned ? 'Check' : 'Circle'}
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

function toggleLearned(id) {
    const w = vocab.find(v => v.id === id);
    if (w) { w.learned = !w.learned; save(); renderLibrary(); status(w.learned ? 'Đã học!' : 'Chưa học', 'success'); }
}

function speak(text) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    speechSynthesis.speak(u);
}

// === FLASHCARD ===
function updateFlashcards() {
    const topics = ['all', ...new Set(vocab.map(w => w.topic))];
    $('fc-topic').innerHTML = topics.map(t => `<option value="${t}">${t==='all'?'Tất cả':t}</option>`).join('');
    generateCards(); renderCards();
}

function generateCards() {
    let pool = vocab.filter(w => !w.learned);
    if (fcTopic !== 'all') pool = pool.filter(w => w.topic === fcTopic);
    currentCards = pool.slice(0, 6);
}

function renderCards() {
    const c = $('fc-container');
    if (!currentCards.length) {
        c.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:white;background:var(--s);border-radius:20px">Đã học hết!</div>`;
        return;
    }
    c.innerHTML = currentCards.map((w, i) => `
        <div class="fc" onclick="flipCard(${i})" id="fc-${i}">
            <div class="fc-chinese">${escapeHtml(w.chinese)}</div>
            <div class="fc-pinyin" style="display:${showPinyinInFlashcard?'block':'none'}">${w.pinyin}</div>
            <div class="fc-viet">${escapeHtml(w.vietnamese)}</div>
        </div>
    `).join('');
}

function togglePinyin() {
    showPinyinInFlashcard = !showPinyinInFlashcard;
    $('pinyin-toggle-btn').textContent = showPinyinInFlashcard ? 'Hiện Pinyin' : 'Ẩn Pinyin';
    document.querySelectorAll('.fc-pinyin').forEach(el => {
        if (!el.closest('.fc').classList.contains('showing-answer')) {
            el.style.display = showPinyinInFlashcard ? 'block' : 'none';
        }
    });
    status(showPinyinInFlashcard ? 'Đã hiện Pinyin' : 'Đã ẩn Pinyin', 'success');
}

function flipCard(i) {
    const f = $(`fc-${i}`);
    const py = f.querySelector('.fc-pinyin');
    const v = f.querySelector('.fc-viet');
    const show = v.style.display !== 'block';
    if (show) { py.style.display = 'block'; v.style.display = 'block'; f.classList.add('showing-answer'); speak(currentCards[i].chinese); }
    else { py.style.display = showPinyinInFlashcard ? 'block' : 'none'; v.style.display = 'none'; f.classList.remove('showing-answer'); }
}

function nextCards() { generateCards(); renderCards(); status('Thẻ mới!', 'success'); }

// === GITHUB ===
function saveGitHubConfig() {
    githubToken = $('github-token').value.trim();
    githubRepo = $('github-repo').value.trim();
    if (!githubToken || !githubRepo) return status('Nhập đầy đủ!', 'error');
    localStorage.setItem('github_token', githubToken);
    localStorage.setItem('github_repo', githubRepo);
    status('Đã lưu!', 'success');
}

function updateGitHubDisplay() {
    $('github-token').value = githubToken ? '***' + githubToken.slice(-4) : '';
    $('github-repo').value = githubRepo;
}

async function syncToGitHub() {
    if (!githubToken || !githubRepo) return status('Chưa cấu hình GitHub', 'error');
    status('Đang sync...');
    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify({version: '1.0', updated: new Date().toISOString(), vocab}, null, 2))));
        let sha = '';
        try {
            const getRes = await fetch(`https://api.github.com/repos/${githubRepo}/contents/data/vocab.json`, {headers: {'Authorization': `token ${githubToken}`}});
            if (getRes.ok) sha = (await getRes.json()).sha;
        } catch (e) {}
        const res = await fetch(`https://api.github.com/repos/${githubRepo}/contents/data/vocab.json`, {
            method: 'PUT',
            headers: {'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json'},
            body: JSON.stringify({message: `Update vocab: ${vocab.length} words`, content, sha: sha || undefined})
        });
        if (res.ok) status('Đã sync!', 'success');
        else throw new Error('Sync failed');
    } catch (e) {
        status('Lỗi sync: ' + e.message, 'error');
    }
}

// === SHEETS ===
function saveDefaultSheet() {
    const id = $('default-sheet-id').value.trim();
    if (!id) return status('Nhập Sheet ID', 'error');
    localStorage.setItem('default_sheet_id', id);
    defaultSheetId = id;
    updateSheetDisplay();
    status('Đã lưu!', 'success');
}

function updateSheetDisplay() {
    $('current-sheet').textContent = defaultSheetId || 'Chưa cấu hình';
    $('default-sheet-id').value = defaultSheetId;
}

function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i], n = line[i+1];
        if (c === '"' && inQuotes && n === '"') { current += '"'; i++; }
        else if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
        else current += c;
    }
    result.push(current.trim());

    const exp = 7;
    if (result.length === exp) return result;
    if (result.length > exp) {
        const fixed = [result[0], result[1], result[2]];
        const meaning = [];
        for (let i = 3; i < result.length - 3; i++) meaning.push(result[i]);
        fixed.push(meaning.join(', '));
        for (let i = result.length - 3; i < result.length; i++) fixed.push(result[i]);
        return fixed;
    }
    return result;
}

async function loadFromSheet() {
    if (!defaultSheetId) return status('Chưa cấu hình', 'error');
    status('Đang load...');
    try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${defaultSheetId}/export?format=csv`);
        const csv = await res.text();
        const lines = csv.split(/\r?\n/).filter(l => l.trim());
        const rows = lines.slice(1).map(parseCSVLine);
        let added = 0;
        rows.forEach(r => {
            if (r.length < 1) return;
            const chinese = r[0], pinyin = r[2] || '', meaning = r[3] || '', topic = r[4] || 'Sheet', learned = r[6] === 'true' || r[6] === '1';
            if (chinese && !vocab.some(v => v.chinese === chinese)) {
                vocab.push({
                    id: crypto.randomUUID?.() || Date.now() + added++,
                    vietnamese: meaning || chinese,
                    chinese, pinyin: pinyin || generatePinyin(chinese),
                    meaning, topic, difficulty: 'easy', learned,
                    nextReview: Date.now(), reviewCount: 0
                });
            }
        });
        save(); renderLibrary();
        status(`Đã thêm ${added} từ!`, 'success');
    } catch (e) {
        status('Lỗi: ' + e.message, 'error');
    }
}

// === EXPORT ===
function exportCSV() {
    const header = 'Vietnamese,Chinese,Pinyin,Meaning,Topic,Difficulty,Learned\n';
    const rows = vocab.map(w => `"${w.vietnamese}","${w.chinese}","${w.pinyin}","${w.meaning}","${w.topic}","${w.difficulty}","${w.learned}"`).join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `vocab_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
    status('Đã export!', 'success');
}

function downloadVocabJSON() {
    const data = {version: '1.0', updated: new Date().toISOString(), vocab};
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'vocab.json';
    link.click();
    status('Đã tải!', 'success');
}

function clearAll() {
    if (confirm('XÓA TẤT CẢ?')) {
        vocab = [];
        save();
        renderLibrary();
        status('Đã xóa', 'success');
    }
}

// === INIT ===
async function init() {
    try {
        const res = await fetch('./data/vocab.json');
        if (res.ok) {
            const data = await res.json();
            if (data.vocab) vocab = data.vocab;
        }
    } catch (e) {}
    if (!vocab.length) {
        vocab = [
            {id:1,vietnamese:'xin chào',chinese:'你好',pinyin:'ni3 hao3',meaning:'hello',topic:'Cơ bản',difficulty:'easy',learned:false,nextReview:Date.now(),reviewCount:0},
            {id:2,vietnamese:'cảm ơn',chinese:'谢谢',pinyin:'xie4 xie4',meaning:'thank you',topic:'Cơ bản',difficulty:'easy',learned:false,nextReview:Date.now(),reviewCount:0},
            {id:3,vietnamese:'tạm biệt',chinese:'再见',pinyin:'zai4 jian4',meaning:'goodbye',topic:'Cơ bản',difficulty:'easy',learned:false,nextReview:Date.now(),reviewCount:0}
        ];
    }
    save();
    renderLibrary();
    updateAddTopicList();
    updateFlashcards();
    updateSheetDisplay();
    updateGitHubDisplay();
}

function waitForLibraries() {
    return new Promise(resolve => {
        const check = setInterval(() => {
            if (typeof pinyinPro !== 'undefined' && typeof HanziWriter !== 'undefined') {
                clearInterval(check);
                resolve();
            }
        }, 100);
        setTimeout(() => { clearInterval(check); resolve(); }, 5000);
    });
}

waitForLibraries().then(init);
