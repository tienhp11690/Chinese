<body>
<div class="container">
    <h1>🔍 Google Sheets CSV Parser - Debug Tool</h1>
    <p class="subtitle">Test và debug việc parse dữ liệu từ Google Sheets</p>
    
    <div class="input-group">
        <label>📊 Google Sheet ID:</label>
        <input type="text" id="sheetId" value="1b0rr7I0Z1gVc9o4pR8-0RpWC-pdtNwjasD_hEZ2Wuxw" placeholder="Nhập Sheet ID...">
    </div>
    
    <div class="btn-group">
        <button class="btn-primary" onclick="loadAndTest()">
            🚀 Load từ Google Sheets
        </button>
        <button class="btn-secondary" onclick="clearResults()">
            🗑️ Clear Results
        </button>
    </div>
    
    <div id="status" class="status"></div>
    
    <div id="results" class="results">
        <div class="section">
            <h2>📄 Raw CSV Preview</h2>
            <div id="rawPreview" class="raw-preview"></div>
        </div>
        
        <div class="section">
            <h2>📦 Parsed Data (First 10 rows)</h2>
            <div id="parsedData"></div>
        </div>
        
        <div id="summary" class="summary" style="display: none;">
            <h3>📊 Summary</h3>
            <div class="summary-stats">
                <div class="stat">
                    <span class="stat-number" id="totalRows">0</span>
                    <span class="stat-label">Total Rows</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="validRows">0</span>
                    <span class="stat-label">Valid Rows</span>
                </div>
                <div class="stat">
                    <span class="stat-number" id="withCommas">0</span>
                    <span class="stat-label">With Commas in Meaning</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadFromSheet() {
    if (!defaultSheetId) return status('⚠️ Chưa cấu hình', 'error');
    
    status('📥 Đang load...');
    try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${defaultSheetId}/export?format=csv`);
        const csv = await res.text();
        
        console.log('📋 Raw CSV preview (first 500 chars):', csv.substring(0, 500));
        
        // Split by newline and parse each line properly
        const lines = csv.split(/\r?\n/);
        console.log('📊 Total lines:', lines.length);
        console.log('📋 Header:', lines[0]);
        
        const rows = lines.slice(1) // Skip header
            .filter(line => line.trim()) // Remove empty lines
            .map(line => parseCSVLine(line));
        
        console.log('📦 Total rows to process:', rows.length);
        
        let added = 0;
        rows.forEach((r, idx) => {
            if (r.length < 1) return;
            
            // Debug first 3 rows
            if (idx < 3) {
                console.log(`\n🔍 Row ${idx + 1}:`, r);
                console.log(`  Columns: ${r.length}`);
            }
            
            // New structure: Chinese - Word type - Pinyin - Meaning - Topic - Difficulty - Learned
            const chinese = r[0] || '';
            // r[1] = Word type (skip)
            const pinyin = r[2] || '';
            const meaning = r[3] || '';
            const topic = r[4] || 'Sheet';
            // r[5] = Difficulty (skip for now, always use 'easy')
            const learned = r[6] ? (r[6].toLowerCase() === 'true' || r[6] === '1') : false;
            
            // Debug first 3 rows
            if (idx < 3) {
                console.log(`  ✅ Parsed:`);
                console.log(`    Chinese: "${chinese}"`);
                console.log(`    Pinyin: "${pinyin}"`);
                console.log(`    Meaning: "${meaning}"`);
                console.log(`    Topic: "${topic}"`);
                console.log(`    Learned: ${learned}`);
            }
            
            if (chinese && !vocab.some(v => v.chinese === chinese)) {
                vocab.push({
                    id: Date.now() + added++,
                    vietnamese: meaning || chinese, // Use meaning as Vietnamese if not provided
                    chinese: chinese,
                    pinyin: pinyin || generatePinyin(chinese),
                    meaning: meaning || chinese,
                    topic: topic,
                    difficulty: 'easy',
                    learned: learned,
                    nextReview: Date.now(),
                    reviewCount: 0
                });
            }
        });
        
        save();
        renderLibrary();
        console.log(`✅ Successfully added ${added} words`);
        status(`✅ Đã thêm ${added} từ!`, 'success');
    } catch (e) {
        console.error('❌ Error loading from sheet:', e);
        status('❌ Lỗi: ' + e.message, 'error');
    }
}
</script>
</body>
