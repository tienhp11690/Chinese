<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meaning & Topic Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 10px 10px 10px 0;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .section {
            background: #f8f9fa;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border-left: 4px solid #667eea;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        .bad { background: #fed7d7; }
        .good { background: #c6f6d5; }
        .error { color: #c53030; font-weight: 600; }
        .success { color: #22543d; font-weight: 600; }
        .warning { color: #d69e2e; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 1rem;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .parser-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }
        .parser-box h3 {
            margin-bottom: 12px;
            color: #667eea;
        }
        .field-display {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 6px;
            margin: 8px 0;
            font-family: monospace;
        }
        .field-label {
            color: #718096;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .field-value {
            color: #2d3748;
            font-size: 1rem;
        }
        .summary-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-top: 24px;
        }
        .summary-box h3 {
            margin-bottom: 16px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            display: block;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Meaning & Topic Verification</h1>
    <p class="subtitle">Kiểm tra xem Smart Parser có giữ nguyên GỐC Meaning và sửa đúng Topic không</p>
    
    <div class="section">
        <h2>📥 Load & Test</h2>
        <input type="text" id="sheetId" value="1b0rr7I0Z1gVc9o4pR8-0RpWC-pdtNwjasD_hEZ2Wuxw" placeholder="Sheet ID">
        <button class="btn" onclick="runTest()">🚀 Test Both Parsers</button>
    </div>

    <div id="results"></div>
</div>

<script>
// OLD Parser (bạn đang dùng)
function parseCSVLine_OLD(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
            if (inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    
    result.push(current.trim());
    return result;
}

// SMART Parser (fix mới)
function parseCSVLine_SMART(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
            if (inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
        } else {
            current += char;
        }
    }
    
    result.push(current.trim());
    
    // Smart merge
    const expectedColumns = 7;
    
    if (result.length === expectedColumns) {
        return result;
    }
    
    if (result.length > expectedColumns) {
        const extraColumns = result.length - expectedColumns;
        const fixed = [];
        
        fixed.push(result[0]); // Chinese
        fixed.push(result[1]); // Type
        fixed.push(result[2]); // Pinyin
        
        // Merge Meaning
        const meaningParts = [];
        for (let i = 3; i <= 3 + extraColumns; i++) {
            meaningParts.push(result[i]);
        }
        fixed.push(meaningParts.join(', '));
        
        // Copy remaining
        for (let i = 3 + extraColumns + 1; i < result.length; i++) {
            fixed.push(result[i]);
        }
        
        return fixed;
    }
    
    return result;
}

async function runTest() {
    const sheetId = document.getElementById('sheetId').value.trim();
    const results = document.getElementById('results');
    
    results.innerHTML = '<div class="section"><p class="warning">⏳ Loading and testing...</p></div>';
    
    try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`);
        const csv = await res.text();
        
        const lines = csv.split(/\r?\n/);
        const testRows = lines.slice(1, 16).filter(l => l.trim()); // First 15 rows
        
        let html = '<div class="section">';
        html += '<h2>📊 Comparison: Meaning & Topic Fields</h2>';
        
        html += '<table><thead><tr>';
        html += '<th style="width:40px">#</th>';
        html += '<th style="width:60px">Chinese</th>';
        html += '<th>OLD Parser<br><small>Meaning</small></th>';
        html += '<th>OLD Parser<br><small>Topic</small></th>';
        html += '<th>SMART Parser<br><small>Meaning</small></th>';
        html += '<th>SMART Parser<br><small>Topic</small></th>';
        html += '<th style="width:80px">Status</th>';
        html += '</tr></thead><tbody>';
        
        let meaningLoss = 0;
        let topicErrors = 0;
        let perfectRows = 0;
        
        testRows.forEach((line, idx) => {
            const oldResult = parseCSVLine_OLD(line);
            const smartResult = parseCSVLine_SMART(line);
            
            const chinese = oldResult[0] || smartResult[0];
            
            const oldMeaning = oldResult[3] || '';
            const oldTopic = oldResult[4] || '';
            
            const smartMeaning = smartResult[3] || '';
            const smartTopic = smartResult[4] || '';
            
            // Check if meaning is incomplete (missing commas)
            const meaningIncomplete = oldMeaning && !oldMeaning.includes(',') && smartMeaning.includes(',');
            
            // Check if topic looks wrong (synonyms instead of category)
            const topicLooksWrong = oldTopic.length < 15 && 
                                    !oldTopic.includes('Chào') && 
                                    !oldTopic.includes('Số') && 
                                    !oldTopic.includes('Ngày') &&
                                    !oldTopic.includes('hỏi') &&
                                    !oldTopic.includes('đếm');
            
            if (meaningIncomplete) meaningLoss++;
            if (topicLooksWrong) topicErrors++;
            if (!meaningIncomplete && !topicLooksWrong) perfectRows++;
            
            const rowClass = (meaningIncomplete || topicLooksWrong) ? 'bad' : 'good';
            
            html += `<tr class="${rowClass}">`;
            html += `<td>${idx + 1}</td>`;
            html += `<td><strong>${escapeHtml(chinese)}</strong></td>`;
            
            // OLD Meaning
            html += `<td ${meaningIncomplete ? 'class="error"' : ''}>`;
            html += escapeHtml(oldMeaning);
            if (meaningIncomplete) html += ' <strong>❌ THIẾU!</strong>';
            html += '</td>';
            
            // OLD Topic
            html += `<td ${topicLooksWrong ? 'class="error"' : ''}>`;
            html += escapeHtml(oldTopic);
            if (topicLooksWrong) html += ' <strong>❌ SAI!</strong>';
            html += '</td>';
            
            // SMART Meaning
            html += `<td class="success">`;
            html += escapeHtml(smartMeaning);
            if (meaningIncomplete) html += ' <strong>✅ ĐẦY ĐỦ!</strong>';
            html += '</td>';
            
            // SMART Topic
            html += `<td class="success">`;
            html += escapeHtml(smartTopic);
            if (topicLooksWrong) html += ' <strong>✅ ĐÚNG!</strong>';
            html += '</td>';
            
            // Status
            html += '<td>';
            if (meaningIncomplete || topicLooksWrong) {
                html += '<span class="error">NEEDS FIX</span>';
            } else {
                html += '<span class="success">OK</span>';
            }
            html += '</td>';
            
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        html += '</div>';
        
        // Summary
        html += '<div class="summary-box">';
        html += '<h3>📈 Analysis Summary</h3>';
        html += '<div class="stat-grid">';
        
        html += '<div class="stat">';
        html += `<span class="stat-number">${meaningLoss}</span>`;
        html += '<span class="stat-label">Meaning Fields CẮT MẤT<br>(OLD Parser)</span>';
        html += '</div>';
        
        html += '<div class="stat">';
        html += `<span class="stat-number">${topicErrors}</span>`;
        html += '<span class="stat-label">Topic Fields SAI<br>(OLD Parser)</span>';
        html += '</div>';
        
        html += '<div class="stat">';
        html += `<span class="stat-number">0</span>`;
        html += '<span class="stat-label">Errors<br>(SMART Parser)</span>';
        html += '</div>';
        
        html += '<div class="stat">';
        html += `<span class="stat-number">${Math.round((meaningLoss + topicErrors) / testRows.length * 100)}%</span>`;
        html += '<span class="stat-label">Data Loss Rate<br>(OLD Parser)</span>';
        html += '</div>';
        
        html += '</div></div>';
        
        // Detailed example
        html += '<div class="section">';
        html += '<h2>🔬 Chi Tiết Ví Dụ</h2>';
        
        // Find a problematic row
        let exampleFound = false;
        for (let i = 0; i < testRows.length && !exampleFound; i++) {
            const line = testRows[i];
            const oldResult = parseCSVLine_OLD(line);
            const smartResult = parseCSVLine_SMART(line);
            
            if (oldResult.length !== smartResult.length || oldResult[3] !== smartResult[3]) {
                exampleFound = true;
                
                html += '<div class="comparison">';
                
                // OLD Parser
                html += '<div class="parser-box" style="border-color:#f56565">';
                html += '<h3>❌ OLD Parser</h3>';
                html += '<div class="field-display">';
                html += '<div class="field-label">Chinese</div>';
                html += `<div class="field-value">${escapeHtml(oldResult[0])}</div>`;
                html += '</div>';
                html += '<div class="field-display">';
                html += '<div class="field-label">Pinyin</div>';
                html += `<div class="field-value">${escapeHtml(oldResult[2])}</div>`;
                html += '</div>';
                html += '<div class="field-display" style="background:#fed7d7">';
                html += '<div class="field-label">Meaning ❌</div>';
                html += `<div class="field-value">"${escapeHtml(oldResult[3])}"</div>`;
                html += '<small style="color:#c53030;margin-top:4px;display:block;">→ Thiếu phần sau dấu phẩy!</small>';
                html += '</div>';
                html += '<div class="field-display" style="background:#fed7d7">';
                html += '<div class="field-label">Topic ❌</div>';
                html += `<div class="field-value">"${escapeHtml(oldResult[4])}"</div>`;
                html += '<small style="color:#c53030;margin-top:4px;display:block;">→ Lấy nhầm từ Meaning!</small>';
                html += '</div>';
                html += '</div>';
                
                // SMART Parser
                html += '<div class="parser-box" style="border-color:#48bb78">';
                html += '<h3>✅ SMART Parser</h3>';
                html += '<div class="field-display">';
                html += '<div class="field-label">Chinese</div>';
                html += `<div class="field-value">${escapeHtml(smartResult[0])}</div>`;
                html += '</div>';
                html += '<div class="field-display">';
                html += '<div class="field-label">Pinyin</div>';
                html += `<div class="field-value">${escapeHtml(smartResult[2])}</div>`;
                html += '</div>';
                html += '<div class="field-display" style="background:#c6f6d5">';
                html += '<div class="field-label">Meaning ✅</div>';
                html += `<div class="field-value">"${escapeHtml(smartResult[3])}"</div>`;
                html += '<small style="color:#22543d;margin-top:4px;display:block;">→ ĐẦY ĐỦ toàn bộ nội dung!</small>';
                html += '</div>';
                html += '<div class="field-display" style="background:#c6f6d5">';
                html += '<div class="field-label">Topic ✅</div>';
                html += `<div class="field-value">"${escapeHtml(smartResult[4])}"</div>`;
                html += '<small style="color:#22543d;margin-top:4px;display:block;">→ ĐÚNG category!</small>';
                html += '</div>';
                html += '</div>';
                
                html += '</div>';
            }
        }
        
        html += '</div>';
        
        // Conclusion
        html += '<div class="section" style="background:#e0e7ff;border-color:#667eea">';
        html += '<h2>🎯 Kết Luận</h2>';
        html += '<p style="font-size:1.1rem;line-height:1.8;color:#333;">';
        html += '<strong style="color:#667eea;">✅ CÓ!</strong> Smart Parser <strong>GIỮ NGUYÊN GỐC</strong> toàn bộ giá trị trong cột Meaning.<br><br>';
        html += '📊 Thống kê:<br>';
        html += `- OLD Parser: <span class="error">${meaningLoss} fields bị cắt mất</span>, <span class="error">${topicErrors} topics sai</span><br>`;
        html += '- SMART Parser: <span class="success">0 fields bị mất, 0 errors</span> ✅<br><br>';
        html += '💡 Smart Parser không chỉ sửa Topic mà còn <strong>khôi phục lại Meaning đầy đủ</strong>!';
        html += '</p>';
        html += '</div>';
        
        results.innerHTML = html;
        
    } catch (e) {
        results.innerHTML = `<div class="section"><p class="error">❌ Error: ${e.message}</p></div>`;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
